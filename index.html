<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: standalone mode removes browser chrome (URL bar) on mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a2744" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary Meta Tags -->
    <title>Vinh Phat ERP</title>
    <meta name="title" content="Vinh Phat ERP" />
    <meta
      name="description"
      content="Hệ thống quản lý ERP cho Công ty Vĩnh Phát"
    />

    <!-- Open Graph / Facebook / Zalo -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quantri.detmayvinhphat.com/" />
    <meta property="og:title" content="Vinh Phat ERP" />
    <meta
      property="og:description"
      content="Hệ thống quản lý ERP cho Công ty Vĩnh Phát"
    />
    <meta
      property="og:image"
      content="https://quantri.detmayvinhphat.com/thumbnail.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://quantri.detmayvinhphat.com/"
    />
    <meta property="twitter:title" content="Vinh Phat ERP" />
    <meta
      property="twitter:description"
      content="Hệ thống quản lý ERP cho Công ty Vĩnh Phát"
    />
    <meta
      property="twitter:image"
      content="https://quantri.detmayvinhphat.com/thumbnail.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script>
      // Áp dụng fluid layout TRƯỚC khi React render — tránh flash
      if (localStorage.getItem('erp-fluid-dashboard') === 'true') {
        document.documentElement.classList.add('fluid');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

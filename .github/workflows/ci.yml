name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Cho phép chạy tay job ai-audit (Actions → CI → Run workflow)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install
        run: npm ci
      - name: Install server dependencies (for server unit tests)
        run: npm ci
        working-directory: server
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Lint CSS
        run: npm run lint:css
      - name: File size ratchet
        run: npm run size:check
      - name: Theme contract check
        run: npm run theme:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
        working-directory: server
      - name: Typecheck
        run: npm run typecheck
        working-directory: server

  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install
        run: npm ci
        working-directory: agent
      - name: Typecheck
        run: npm run typecheck
        working-directory: agent

  # ─────────────────────────────────────────────────────────────
  # E2E (Playwright) — đã chuyển từ pre-push hook sang CI.
  # Bật bằng Repository Variable: Settings → Secrets and variables →
  # Actions → Variables → E2E_ENABLED = true
  # Yêu cầu Repository Secrets:
  #   E2E_EMAIL, E2E_PASSWORD,
  #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
  # (global-setup đăng nhập qua Supabase REST API — xem e2e/global-setup.ts)
  # ─────────────────────────────────────────────────────────────
  e2e:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # RPC Sync — frontend rpc() calls phải khớp signature trong DB.
  # Cần kết nối DB thật nên mặc định TẮT. Bật bằng Repository Variable:
  #   Settings → Secrets and variables → Actions → Variables → RPC_SYNC_ENABLED = true
  # Yêu cầu Repository Secret: DATABASE_URL (connection string Postgres/Supabase).
  #
  # Khi job này chưa bật, AI không được coi rpc:check là PASS —
  # xem AI_WORKFLOW.md §1.2 Evidence Rule: báo cáo là [NOT VERIFIED].
  # ────────────────────────────────────────────────────────────
  rpc-sync:
    if: ${{ vars.RPC_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: RPC sync
        run: npm run rpc:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─────────────────────────────────────────────────────────────
  # AI Audit — chỉ chạy thủ công (Actions → CI → Run workflow)
  # vì gọi Anthropic API (tốn chi phí), không phù hợp chạy mỗi push.
  # Yêu cầu Repository Secret: ANTHROPIC_API_KEY
  # ─────────────────────────────────────────────────────────────
  ai-audit:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: AI Audit
        run: npm run ai:audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

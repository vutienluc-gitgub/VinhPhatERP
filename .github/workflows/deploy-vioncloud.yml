name: Deploy to Vion Cloud (VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vioncloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Fullstack App to Vion Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VION_VPS_HOST }}
          username: ${{ secrets.VION_VPS_USERNAME }}
          key: ${{ secrets.VION_VPS_SSH_KEY }}
          port: ${{ secrets.VION_VPS_PORT || '22' }}
          script: |
            set -e
            echo "🚀 Starting Deployment on Vion Cloud VPS..."

            # 1. Di chuyển vào thư mục dự án
            APP_DIR="/var/www/vinhphaterp"
            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Directory $APP_DIR does not exist. Please clone repository first."
              exit 1
            fi
            cd "$APP_DIR"

            # 2. Pull code mới từ GitHub
            echo "📥 Fetching latest code from main branch..."
            git fetch --all
            git reset --hard origin/main

            # Untracked files from older revisions survive `reset --hard`, and
            # Tailwind scans the whole checkout — so a stale .tsx anywhere
            # injects its classes into the production stylesheet. `-d` without
            # `-x` drops those files while keeping gitignored paths (.env,
            # node_modules) intact.
            echo "🗑️  Removing stale untracked files..."
            git clean -fd -e supabase/

            # 3. Build Frontend React
            echo "📦 Building Frontend..."
            # `npm ci` removes node_modules and installs exactly the versions
            # pinned in the lockfile, so every deploy builds from the same
            # dependency tree. Plain `npm install` keeps whatever is already on
            # disk, so a stale package left by an older deploy can change
            # Tailwind's output and leak classes into the production stylesheet.
            # `--include=dev` is required because vite/tsc/tailwind live in
            # devDependencies, and NODE_ENV=production would otherwise skip them.
            npm ci --include=dev
            npm run build

            # 4. Build Backend Hono API
            echo "⚙️ Building Backend Server..."
            cd server
            npm ci --include=dev
            npm run build
            cd ..

            # 5. Khởi chạy / Reload PM2 Backend
            echo "🔄 Reloading PM2 Service..."
            if pm2 describe vinhphat-api > /dev/null 2>&1; then
              pm2 reload vinhphat-api
            else
              pm2 start server/dist/index.js --name "vinhphat-api"
            fi
            pm2 save

            # 5b. Đồng bộ mã nguồn & assets vào Docker container vinhphaterp-app (đang phục vụ port 80 & 3001)
            echo "🐳 Updating Docker container vinhphaterp-app..."
            if docker ps -q -f name=vinhphaterp-app | grep -q .; then
              docker cp "$APP_DIR/dist/." vinhphaterp-app:/usr/share/nginx/html/
              docker cp "$APP_DIR/server/dist/." vinhphaterp-app:/app/server/dist/
              docker cp "$APP_DIR/server/package.json" vinhphaterp-app:/app/server/package.json
              if [ -f "$APP_DIR/.env" ]; then
                docker cp "$APP_DIR/.env" vinhphaterp-app:/app/server/.env || true
                docker cp "$APP_DIR/.env" vinhphaterp-app:/app/.env || true
              fi
              docker exec vinhphaterp-app npm --prefix /app/server install --only=production || true
              docker restart vinhphaterp-app
            fi

            # 6. Reload / Restart Nginx
            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx || echo "⚠️ Nginx reload/restart failed on VPS (check 'systemctl status nginx' or 'nginx -t'). Skipping Nginx restart."

            # 7. Smoke Test & Health Guard Verification (Bảo vệ tự động sau triển khai)
            echo "🛡️ Starting Automated Post-Deployment Smoke Tests..."

            # 7a. Kiểm tra trạng thái các Docker container Supabase nòng cốt
            echo "🔍 [Check 1/5] Verifying Supabase core containers..."
            for container in supabase-db supabase-rest supabase-auth supabase-envoy; do
              if ! docker ps --filter "name=$container" --filter "status=running" | grep -q "$container"; then
                echo "❌ CRITICAL: Container $container is not running!"
                exit 1
              fi
            done
            echo "✅ Core containers are running."

            # 7b. Kiểm tra truy vấn Database thực tế
            echo "🔍 [Check 2/5] Verifying Postgres Database connectivity & query..."
            if ! docker exec supabase-db psql -U postgres -d postgres -c "SELECT count(*) FROM customers;" > /dev/null 2>&1; then
              echo "❌ CRITICAL: Postgres database query failed!"
              exit 1
            fi
            echo "✅ Postgres database query passed."

            # 7c. Kiểm tra PostgREST API endpoint
            echo "🔍 [Check 3/5] Verifying PostgREST API (/rest/v1/customers)..."
            API_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/rest/v1/customers")
            if [ "$API_CODE" != "200" ]; then
              echo "❌ CRITICAL: PostgREST API returned HTTP $API_CODE instead of 200!"
              exit 1
            fi
            echo "✅ PostgREST API responded HTTP 200."

            # 7d. Kiểm tra GoTrue Google OAuth authorize endpoint
            echo "🔍 [Check 4/5] Verifying Google OAuth endpoint (/auth/v1/authorize)..."
            AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/auth/v1/authorize?provider=google&redirect_to=https://quantri.detmayvinhphat.com/auth/callback")
            if [ "$AUTH_CODE" != "302" ]; then
              echo "❌ CRITICAL: Google OAuth returned HTTP $AUTH_CODE instead of 302!"
              exit 1
            fi
            echo "✅ Google OAuth endpoint responded HTTP 302 redirect."

            # 7e. Kiểm tra GoTrue Schema Scan Integrity (Không được có NULL trong auth.users email_change)
            echo "🔍 [Check 5/5] Verifying GoTrue auth.users NULL-safety scan..."
            NULL_USERS=$(docker exec -e PGPASSWORD=6e7801c38c7a835ff234849259f3689a supabase-db psql -h 127.0.0.1 -U supabase_admin -d postgres -t -A -c "SELECT count(*) FROM auth.users WHERE email_change IS NULL;")
            if [ "$NULL_USERS" != "0" ]; then
              echo "❌ CRITICAL: Detected $NULL_USERS users with NULL email_change in auth.users!"
              exit 1
            fi
            echo "✅ GoTrue schema null-safety verified (0 nulls)."

            echo "======================================================"
            echo "🎉 ALL POST-DEPLOYMENT SMOKE TESTS PASSED (5/5)!"
            echo "✅ Deployment finished and verified successfully!"
            echo "======================================================"
